<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gumGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="gleamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>
  <!-- Background / Mouth Cavity -->
  <rect width="600" height="400" fill="#0F172A"/>
  
  <!-- Healthy Pink Upper Gum -->
  <path d="M50 110 Q 300 70 550 110 C 520 180 80 180 50 110 Z" fill="url(#gumGradA)"/>
  
  <!-- Upper Teeth (Gleaming Pearl White & Polished) -->
  <g fill="url(#gleamGrad)" stroke="#CBD5E1" stroke-width="1.5">
    <!-- Lateral Left -->
    <rect x="150" y="140" width="60" height="95" rx="14"/>
    <!-- Central Left -->
    <rect x="220" y="140" width="75" height="110" rx="16"/>
    <!-- Central Right -->
    <rect x="305" y="140" width="75" height="110" rx="16"/>
    <!-- Lateral Right -->
    <rect x="390" y="140" width="60" height="95" rx="14"/>
  </g>

  <!-- Enamel Highlights -->
  <path d="M228 150 L236 150 L234 235 L228 235 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M312 150 L320 150 L318 235 L312 235 Z" fill="#FFFFFF" opacity="0.8"/>

  <!-- Sparkling Stars -->
  <g fill="#38BDF8">
    <path d="M270 160 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4 l8 -4 z"/>
    <path d="M360 175 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z" transform="scale(0.8) translate(70, 20)"/>
  </g>

  <!-- Healthy Lower Lip -->
  <path d="M50 280 Q 300 340 550 280 C 500 240 100 240 50 280 Z" fill="#BE123C"/>
  
  <!-- Banner label -->
  <rect x="450" y="20" width="130" height="34" rx="6" fill="#16A34A" opacity="0.95"/>
  <text x="515" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AFTER (পরে)</text>
</svg>
