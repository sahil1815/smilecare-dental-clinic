<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#1E293B"/>
  <!-- Gum arch -->
  <path d="M50 110 Q 300 70 550 110 C 520 180 80 180 50 110 Z" fill="#E11D48"/>
  
  <g fill="#F1F5F9" stroke="#94A3B8" stroke-width="2">
    <!-- Lateral Left -->
    <rect x="150" y="140" width="60" height="95" rx="14"/>
    
    <!-- Fractured Left Central Tooth -->
    <path d="M220 140 h 75 v 65 l -25 35 l -20 -15 l -30 15 z" fill="#F8FAFC"/>
    
    <!-- Exposed dark inner cavity / fracture site -->
    <path d="M245 205 l 25 -10 l 15 25 l -20 15 z" fill="#451A03" stroke="#78350F" stroke-width="2"/>
    <path d="M235 220 l 15 -8 l 10 12 z" fill="#B91C1C"/>

    <!-- Central Right (Intact) -->
    <rect x="305" y="140" width="75" height="110" rx="16"/>
    <!-- Lateral Right -->
    <rect x="390" y="140" width="60" height="95" rx="14"/>
  </g>
  
  <!-- Lower Lip -->
  <path d="M50 280 Q 300 340 550 280 C 500 240 100 240 50 280 Z" fill="#9F1239"/>
  <!-- Banner label -->
  <rect x="20" y="20" width="130" height="34" rx="6" fill="#DC2626" opacity="0.95"/>
  <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BEFORE (আগে)</text>
</svg>
