<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#1E293B"/>
  <!-- Gum arch -->
  <path d="M50 110 Q 300 70 550 110 C 520 180 80 180 50 110 Z" fill="#E11D48"/>
  
  <!-- Crooked / Crowded Teeth (Rotated and overlapping) -->
  <g fill="#F8FAFC" stroke="#94A3B8" stroke-width="2">
    <!-- Left Canine -->
    <path d="M120 145 l35-10 l10 90 l-35 5 z" rx="10"/>
    <!-- Left Lateral (pushed back) -->
    <rect x="160" y="155" width="45" height="85" rx="10" fill="#E2E8F0"/>
    <!-- Left Central (overlapping front, tilted) -->
    <g transform="rotate(7 245 190)">
      <rect x="210" y="135" width="70" height="110" rx="14" fill="#F1F5F9"/>
    </g>
    <!-- Right Central (overlapping back, tilted opposite) -->
    <g transform="rotate(-9 335 190)">
      <rect x="300" y="142" width="70" height="105" rx="14" fill="#E2E8F0"/>
    </g>
    <!-- Right Lateral (high canine space problem) -->
    <g transform="rotate(12 395 185)">
      <rect x="375" y="130" width="48" height="90" rx="10" fill="#F8FAFC"/>
    </g>
    <!-- Right Canine -->
    <path d="M430 140 l35 15 l-15 90 l-35-10 z" rx="10"/>
  </g>
  
  <!-- Lower Lip -->
  <path d="M50 280 Q 300 340 550 280 C 500 240 100 240 50 280 Z" fill="#9F1239"/>
  <!-- Banner label -->
  <rect x="20" y="20" width="130" height="34" rx="6" fill="#DC2626" opacity="0.95"/>
  <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BEFORE (আগে)</text>
</svg>
