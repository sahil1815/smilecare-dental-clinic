<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0D5C56"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#bgGrad1)"/>
  <circle cx="200" cy="180" r="140" fill="#FFFFFF" opacity="0.6"/>
  <!-- Body / Lab Coat -->
  <path d="M70 480c0-90 45-140 130-140s130 50 130 140z" fill="url(#coatGrad)"/>
  <!-- Scrub under coat -->
  <path d="M160 340h80v140h-80z" fill="url(#scrubGrad)"/>
  <!-- Coat Lapels -->
  <path d="M125 340l50 140h-40l-55-140z" fill="#E2E8F0"/>
  <path d="M275 340l-50 140h40l55-140z" fill="#E2E8F0"/>
  <!-- Stethoscope -->
  <path d="M150 340c0 40 15 80 50 80s50-40 50-80" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="425" r="12" fill="#94A3B8" stroke="#475569" stroke-width="4"/>
  <!-- Neck -->
  <rect x="175" y="270" width="50" height="75" rx="8" fill="#F8C8A5"/>
  <!-- Head -->
  <ellipse cx="200" cy="200" rx="65" ry="80" fill="#F8C8A5"/>
  <!-- Hair (Male, short neat) -->
  <path d="M135 185c0-45 25-75 65-75s65 30 65 75c-15-20-40-25-65-25s-50 5-65 25z" fill="#1E293B"/>
  <!-- Glasses -->
  <rect x="150" y="180" width="38" height="26" rx="6" fill="none" stroke="#0F766E" stroke-width="4"/>
  <rect x="212" y="180" width="38" height="26" rx="6" fill="none" stroke="#0F766E" stroke-width="4"/>
  <line x1="188" y1="192" x2="212" y2="192" stroke="#0F766E" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="169" cy="193" r="4" fill="#1E293B"/>
  <circle cx="231" cy="193" r="4" fill="#1E293B"/>
  <!-- Smile -->
  <path d="M185 240c5 8 25 8 30 0" fill="none" stroke="#991B1B" stroke-width="4" stroke-linecap="round"/>
  <!-- Badge -->
  <g transform="translate(90, 390)">
    <rect width="50" height="28" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="6" y="6" width="38" height="4" rx="2" fill="#0F766E"/>
    <rect x="6" y="14" width="24" height="3" rx="1" fill="#94A3B8"/>
  </g>
</svg>
