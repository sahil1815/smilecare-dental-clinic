<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="zirconiaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="90%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="#0F172A"/>
  <!-- Healthy Gum arch -->
  <path d="M50 110 Q 300 70 550 110 C 520 180 80 180 50 110 Z" fill="#FB7185"/>
  
  <g stroke="#CBD5E1" stroke-width="1.5">
    <!-- Lateral Left -->
    <rect x="150" y="140" width="60" height="95" rx="14" fill="#F8FAFC"/>
    
    <!-- Restored Left Central with Zirconia Crown (Perfect Shape & Translucency) -->
    <rect x="220" y="140" width="75" height="110" rx="16" fill="url(#zirconiaGrad)"/>
    <!-- Subtle margin contour to show crown precision -->
    <path d="M222 144 q 35 6 71 0" fill="none" stroke="#0F766E" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Central Right -->
    <rect x="305" y="140" width="75" height="110" rx="16" fill="#F8FAFC"/>
    <!-- Lateral Right -->
    <rect x="390" y="140" width="60" height="95" rx="14" fill="#F8FAFC"/>
  </g>

  <!-- Sparkle on restored crown -->
  <path d="M255 170 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#38BDF8"/>
  
  <!-- Lower Lip -->
  <path d="M50 280 Q 300 340 550 280 C 500 240 100 240 50 280 Z" fill="#BE123C"/>
  <!-- Banner label -->
  <rect x="450" y="20" width="130" height="34" rx="6" fill="#16A34A" opacity="0.95"/>
  <text x="515" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AFTER (পরে)</text>
</svg>
