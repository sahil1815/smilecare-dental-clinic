<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#0F172A"/>
  <!-- Healthy Gum arch -->
  <path d="M50 110 Q 300 70 550 110 C 520 180 80 180 50 110 Z" fill="#FB7185"/>
  
  <!-- Perfectly Aligned Teeth Arch -->
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5">
    <!-- Left Canine -->
    <path d="M110 145 q 15-5 30 0 l 10 85 q -20 10 -35 0 z"/>
    <!-- Left Lateral -->
    <rect x="155" y="140" width="60" height="98" rx="14"/>
    <!-- Left Central -->
    <rect x="225" y="136" width="70" height="110" rx="15"/>
    <!-- Right Central -->
    <rect x="305" y="136" width="70" height="110" rx="15"/>
    <!-- Right Lateral -->
    <rect x="385" y="140" width="60" height="98" rx="14"/>
    <!-- Right Canine -->
    <path d="M455 145 q 15-5 30 0 l -5 85 q -20 10 -35 0 z"/>
  </g>

  <!-- Sparkle -->
  <path d="M300 135 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#38BDF8"/>
  <path d="M225 150 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#38BDF8"/>
  
  <!-- Lower Lip -->
  <path d="M50 280 Q 300 340 550 280 C 500 240 100 240 50 280 Z" fill="#BE123C"/>
  <!-- Banner label -->
  <rect x="450" y="20" width="130" height="34" rx="6" fill="#16A34A" opacity="0.95"/>
  <text x="515" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AFTER (পরে)</text>
</svg>
